name: opencode

# Ler a OS e executar: comente /oc (ou /opencode) em um issue/PR.
# O codigo executado volta como PR/comentario no proprio repositorio.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode (modelos ipeagpt)
        uses: anomalyco/opencode/github@latest
        env:
          IPEAGPT_API_KEY: ${{ secrets.IPEAGPT_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: ipeagpt/deepseek-v4.1-flash
          use_github_token: true
